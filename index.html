<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>社团管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2>社团管理系统登录</h2>
        <div>
            <label>账号</label>
            <input id="username" type="text" placeholder="管理员admin / 普通用户user">
        </div>
        <div>
            <label>密码</label>
            <input id="pwd" type="password" placeholder="密码123456">
        </div>
        <button onclick="login()">登录</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
